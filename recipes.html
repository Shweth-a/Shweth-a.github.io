    <!-- Lightbox for recipe images -->
    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-labelledby="lightbox-caption">
        <img class="lightbox-img" alt="" />
        <div class="lightbox-caption" id="lightbox-caption"></div>
        <button class="lightbox-download" aria-label="Download image">⬇</button>
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
    </div>

    <script>
        // Simple lightbox for recipe images
        (function(){
            const lightbox = document.getElementById('lightbox');
            const lbImg = lightbox.querySelector('.lightbox-img');
            const lbCaption = lightbox.querySelector('.lightbox-caption');
            const closeBtn = lightbox.querySelector('.lightbox-close');
            const downloadBtn = lightbox.querySelector('.lightbox-download');

            function openLightbox(src, alt, caption){
                lbImg.src = src;
                lbImg.alt = alt || '';
                lbCaption.textContent = caption || '';
                lightbox.classList.add('open');
                lightbox.setAttribute('aria-hidden','false');
                document.body.classList.add('lightbox-open');
                // focus close button for accessibility
                closeBtn.focus();
            }

            function closeLightbox(){
                lightbox.classList.remove('open');
                lightbox.setAttribute('aria-hidden','true');
                document.body.classList.remove('lightbox-open');
                lbImg.src = '';
                lbImg.alt = '';
                lbCaption.textContent = '';
            }

            // open when clicking any recipe-card image
            document.querySelectorAll('.recipe-card img').forEach(img => {
                img.style.cursor = 'zoom-in';
                img.addEventListener('click', () => {
                    // use current src
                    const large = img.src;
                    openLightbox(large, img.alt || '', '');
                });
            });

            // download handler
            downloadBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.href = lbImg.src;
                link.download = lbImg.alt || 'recipe.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            // close handlers: close button, click outside image, Escape key
            closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if(e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
            });
        })();
    </script>
