  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Simple lightbox for art images
    (function(){
      const lightbox = document.getElementById('lightbox');
      const lbImg = lightbox.querySelector('.lightbox-img');
      const lbCaption = lightbox.querySelector('.lightbox-caption');
      const closeBtn = lightbox.querySelector('.lightbox-close');

      function openLightbox(src, alt, caption){
        lbImg.src = src;
        lbImg.alt = alt || '';
        lbCaption.textContent = caption || '';
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
        document.body.classList.add('lightbox-open');
        // focus close button for accessibility
        closeBtn.focus();
      }

      function closeLightbox(){
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden','true');
        document.body.classList.remove('lightbox-open');
        lbImg.src = '';
        lbImg.alt = '';
        lbCaption.textContent = '';
      }

      // open when clicking any art-frame image
      document.querySelectorAll('.art-frame img').forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          // if image has data-large use that, otherwise use current src
          const large = img.dataset.large || img.src;
          // caption: prefer adjacent figcaption text
          const fig = img.closest('figure');
          const figcap = fig ? (fig.querySelector('.art-meta') ? fig.querySelector('.art-meta').textContent.trim() : '') : '';
          openLightbox(large, img.alt || '', figcap);
        });
      });

      // close handlers: close button, click outside image, Escape key
      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if(e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });
    })();
  </script>
